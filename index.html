<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeBuddy - AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <div class="avatar">🤖</div>
      <div>
        <h1>CodeBuddy</h1>
        <p><span class="dot"></span> Online · NLP powered</p>
      </div>
      <button id="clearBtn" title="Clear chat">Clear</button>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <div class="chips" id="chips">
      <button>What can you do?</button>
      <button>Tell me a joke</button>
      <button>Resume tips</button>
      <button>How to learn Python?</button>
      <button>Calculate 12*8</button>
    </div>

    <form id="chatForm" class="input-row" autocomplete="off">
      <input id="userInput" type="text" placeholder="Type your message..." maxlength="500" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
